<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StatCounter Stats</title>
</head>

<body>

  <h2>StatCounter Data</h2>

  <div id="statcounter-data">
    Loading stats...
  </div>

  <script>
    const PROJECT_ID = "13352957";

    const apiUrl =
      `https://api.statcounter.com/stats/?vn=3&s=popular&f=json&pi=${PROJECT_ID}&g=daily&ct=pageviews`;

    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error("API Error: " + response.status);
        }
        return response.json();
      })
      .then(data => {
        console.log("StatCounter Data:", data);

        document.getElementById("statcounter-data").innerHTML = `
          <h3>Stats Loaded Successfully</h3>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      })
      .catch(error => {
        console.error("Error:", error);

        document.getElementById("statcounter-data").innerHTML =
          "<p>Failed to load StatCounter stats.</p>";
      });
  </script>

</body>
</html>
